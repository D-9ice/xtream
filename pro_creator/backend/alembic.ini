[alembic]
script_location = alembic_migrations

# The runtime URL is injected by app startup (or via DATABASE_URL env var) when running
# `alembic` commands directly. This placeholder keeps Alembic happy.
sqlalchemy.url = sqlite:///./pro_creator.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
