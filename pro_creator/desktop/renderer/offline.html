<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Creator Pro Desktop</title>
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
        margin: 0;
        padding: 48px;
      }
      .card {
        max-width: 720px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 32px;
      }
      h1 {
        margin-top: 0;
        font-size: 28px;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      code {
        display: block;
        margin-top: 12px;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px;
        color: #22d3ee;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pro Creator Pro Desktop</h1>
      <p>
        The desktop shell is running, but the web app isn't reachable yet.
        Start the backend and frontend, then reopen this window.
      </p>
      <code>
        Backend: http://127.0.0.1:8000<br />
        Frontend: http://localhost:3000
      </code>
    </div>
  </body>
</html>
