version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set procreator http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p procreator/${S3_BUCKET:-pro-creator};
      mc anonymous set download procreator/${S3_BUCKET:-pro-creator};
      exit 0;
      "

  backend:
    build:
      context: ./backend
    volumes:
      - ./deploy:/app/deploy:ro
      - backend_data:/data
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-false}"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/pro_creator.db}
      STORAGE_BACKEND: s3
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/${S3_BUCKET:-pro-creator}}
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/${S3_BUCKET:-pro-creator}}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-pro-creator}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      FACTORY_MODE_ENABLED: "${FACTORY_MODE_ENABLED:-false}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-false}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@procreator.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-LocalAdminPass123!}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD:-LocalAdminPass123!}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_BASE_URL: "${XAI_BASE_URL:-https://api.x.ai/v1}"
      XAI_TEXT_MODEL: "${XAI_TEXT_MODEL:-grok-4.20-beta-latest-non-reasoning}"
      XAI_IMAGE_MODEL: "${XAI_IMAGE_MODEL:-grok-imagine-image}"
      XAI_VIDEO_MODEL: "${XAI_VIDEO_MODEL:-grok-imagine-video}"
      XAI_TTS_VOICE_ID: "${XAI_TTS_VOICE_ID:-eve}"
      XAI_STT_MODEL: "${XAI_STT_MODEL:-grok-voice-transcribe-2.0}"
      GROK_IMAGINE_TARGET_SEGMENT_SECONDS: "${GROK_IMAGINE_TARGET_SEGMENT_SECONDS:-15}"
      GROK_IMAGINE_INITIAL_CHUNK_SECONDS: "${GROK_IMAGINE_INITIAL_CHUNK_SECONDS:-15}"
      GROK_IMAGINE_EXTENSION_CHUNK_SECONDS: "${GROK_IMAGINE_EXTENSION_CHUNK_SECONDS:-10}"
      GROK_IMAGINE_ASPECT_RATIO: "${GROK_IMAGINE_ASPECT_RATIO:-16:9}"
      GROK_IMAGINE_RESOLUTION: "${GROK_IMAGINE_RESOLUTION:-720p}"
      GROK_IMAGINE_POLL_TIMEOUT_SECONDS: "${GROK_IMAGINE_POLL_TIMEOUT_SECONDS:-1800}"
      GROK_IMAGINE_POLL_INTERVAL_SECONDS: "${GROK_IMAGINE_POLL_INTERVAL_SECONDS:-5}"
      GROK_IMAGINE_MAX_CLIP_BYTES: "${GROK_IMAGINE_MAX_CLIP_BYTES:-2147483648}"
      FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS: "${FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS:-180}"
      FFMPEG_CONCAT_TIMEOUT_SECONDS: "${FFMPEG_CONCAT_TIMEOUT_SECONDS:-300}"
      VIDEO_IMPORT_MAX_BYTES: "${VIDEO_IMPORT_MAX_BYTES:-2147483648}"
      VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS: "${VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS:-10}"
      VIDEO_IMPORT_READ_TIMEOUT_SECONDS: "${VIDEO_IMPORT_READ_TIMEOUT_SECONDS:-60}"
      VIDEO_IMPORT_MAX_REDIRECTS: "${VIDEO_IMPORT_MAX_REDIRECTS:-5}"
      CREDITS_COST_SCRIPT_GENERATE: "${CREDITS_COST_SCRIPT_GENERATE:-6}"
      CREDITS_COST_SCRIPT_IMPORT: "${CREDITS_COST_SCRIPT_IMPORT:-2}"
      CREDITS_COST_VOICE_GENERATE: "${CREDITS_COST_VOICE_GENERATE:-8}"
      CREDITS_COST_IMAGE_GENERATE: "${CREDITS_COST_IMAGE_GENERATE:-7}"
      CREDITS_COST_VIDEO_RENDER: "${CREDITS_COST_VIDEO_RENDER:-20}"
      CREDITS_COST_VIDEO_EXPORT: "${CREDITS_COST_VIDEO_EXPORT:-4}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-http://localhost:3000/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-http://localhost:3000/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC:-true}"
      RHUBARB_PATH: "${RHUBARB_PATH:-}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-false}"
      RATE_LIMIT_AUTH_REQUESTS: "${RATE_LIMIT_AUTH_REQUESTS:-15}"
      RATE_LIMIT_HEAVY_REQUESTS: "${RATE_LIMIT_HEAVY_REQUESTS:-30}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
      - minio

  worker:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery_app worker -l info
    volumes:
      - ./deploy:/app/deploy:ro
      - backend_data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/pro_creator.db}
      STORAGE_BACKEND: s3
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/${S3_BUCKET:-pro-creator}}
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/${S3_BUCKET:-pro-creator}}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-pro-creator}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      FACTORY_MODE_ENABLED: "${FACTORY_MODE_ENABLED:-false}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-false}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-false}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@procreator.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-LocalAdminPass123!}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD:-LocalAdminPass123!}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_BASE_URL: "${XAI_BASE_URL:-https://api.x.ai/v1}"
      XAI_TEXT_MODEL: "${XAI_TEXT_MODEL:-grok-4.20-beta-latest-non-reasoning}"
      XAI_IMAGE_MODEL: "${XAI_IMAGE_MODEL:-grok-imagine-image}"
      XAI_VIDEO_MODEL: "${XAI_VIDEO_MODEL:-grok-imagine-video}"
      XAI_TTS_VOICE_ID: "${XAI_TTS_VOICE_ID:-eve}"
      XAI_STT_MODEL: "${XAI_STT_MODEL:-grok-voice-transcribe-2.0}"
      GROK_IMAGINE_TARGET_SEGMENT_SECONDS: "${GROK_IMAGINE_TARGET_SEGMENT_SECONDS:-15}"
      GROK_IMAGINE_INITIAL_CHUNK_SECONDS: "${GROK_IMAGINE_INITIAL_CHUNK_SECONDS:-15}"
      GROK_IMAGINE_EXTENSION_CHUNK_SECONDS: "${GROK_IMAGINE_EXTENSION_CHUNK_SECONDS:-10}"
      GROK_IMAGINE_ASPECT_RATIO: "${GROK_IMAGINE_ASPECT_RATIO:-16:9}"
      GROK_IMAGINE_RESOLUTION: "${GROK_IMAGINE_RESOLUTION:-720p}"
      GROK_IMAGINE_POLL_TIMEOUT_SECONDS: "${GROK_IMAGINE_POLL_TIMEOUT_SECONDS:-1800}"
      GROK_IMAGINE_POLL_INTERVAL_SECONDS: "${GROK_IMAGINE_POLL_INTERVAL_SECONDS:-5}"
      GROK_IMAGINE_MAX_CLIP_BYTES: "${GROK_IMAGINE_MAX_CLIP_BYTES:-2147483648}"
      FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS: "${FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS:-180}"
      FFMPEG_CONCAT_TIMEOUT_SECONDS: "${FFMPEG_CONCAT_TIMEOUT_SECONDS:-300}"
      VIDEO_IMPORT_MAX_BYTES: "${VIDEO_IMPORT_MAX_BYTES:-2147483648}"
      VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS: "${VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS:-10}"
      VIDEO_IMPORT_READ_TIMEOUT_SECONDS: "${VIDEO_IMPORT_READ_TIMEOUT_SECONDS:-60}"
      VIDEO_IMPORT_MAX_REDIRECTS: "${VIDEO_IMPORT_MAX_REDIRECTS:-5}"
      CREDITS_COST_SCRIPT_GENERATE: "${CREDITS_COST_SCRIPT_GENERATE:-6}"
      CREDITS_COST_SCRIPT_IMPORT: "${CREDITS_COST_SCRIPT_IMPORT:-2}"
      CREDITS_COST_VOICE_GENERATE: "${CREDITS_COST_VOICE_GENERATE:-8}"
      CREDITS_COST_IMAGE_GENERATE: "${CREDITS_COST_IMAGE_GENERATE:-7}"
      CREDITS_COST_VIDEO_RENDER: "${CREDITS_COST_VIDEO_RENDER:-20}"
      CREDITS_COST_VIDEO_EXPORT: "${CREDITS_COST_VIDEO_EXPORT:-4}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-http://localhost:3000/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-http://localhost:3000/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC:-true}"
      RHUBARB_PATH: "${RHUBARB_PATH:-}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      - redis
      - backend

  beat:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery_app beat -l info
    volumes:
      - ./deploy:/app/deploy:ro
      - backend_data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/pro_creator.db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
    environment:
      # Use IPv4 loopback explicitly; some environments resolve localhost -> ::1 which
      # won't connect if Docker is bound only on 127.0.0.1.
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
      NEXT_PUBLIC_PROJECTS_BASE: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/${S3_BUCKET:-pro-creator}}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  minio_data:
  backend_data:
