version: "3.9"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    volumes:
      # Allow *_FILE secrets like ./deploy/secrets/jwt_secret to resolve inside the container.
      - ./deploy:/app/deploy:ro
    environment:
      ENVIRONMENT: production
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-true}"
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRET_PREFIX: ${AWS_SECRET_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_URL_AWS_SECRET_ID: ${DATABASE_URL_AWS_SECRET_ID:-}
      DATABASE_URL_AWS_SECRET_KEY: ${DATABASE_URL_AWS_SECRET_KEY:-}
      STORAGE_BACKEND: s3
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY_FILE: ${S3_ACCESS_KEY_FILE:-}
      S3_SECRET_KEY_FILE: ${S3_SECRET_KEY_FILE:-}
      S3_ACCESS_KEY_AWS_SECRET_ID: ${S3_ACCESS_KEY_AWS_SECRET_ID:-}
      S3_ACCESS_KEY_AWS_SECRET_KEY: ${S3_ACCESS_KEY_AWS_SECRET_KEY:-}
      S3_SECRET_KEY_AWS_SECRET_ID: ${S3_SECRET_KEY_AWS_SECRET_ID:-}
      S3_SECRET_KEY_AWS_SECRET_KEY: ${S3_SECRET_KEY_AWS_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      FACTORY_MODE_ENABLED: "${FACTORY_MODE_ENABLED:-false}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_SECRET_AWS_SECRET_ID: ${JWT_SECRET_AWS_SECRET_ID:-}
      JWT_SECRET_AWS_SECRET_KEY: ${JWT_SECRET_AWS_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_BOOTSTRAP_SYNC: "${ADMIN_BOOTSTRAP_SYNC:-false}"
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD_FILE: ${ADMIN_DASHBOARD_PASSWORD_FILE:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY:-}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      ADMIN_2FA_TOTP_SECRET: ${ADMIN_2FA_TOTP_SECRET:-}
      ADMIN_2FA_TOTP_SECRET_FILE: ${ADMIN_2FA_TOTP_SECRET_FILE:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      ADMIN_PASSWORD_AWS_SECRET_ID: ${ADMIN_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_PASSWORD_AWS_SECRET_KEY: ${ADMIN_PASSWORD_AWS_SECRET_KEY:-}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      OWNER_EMAIL_ALLOWLIST: "${OWNER_EMAIL_ALLOWLIST:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_API_KEY_FILE: "${XAI_API_KEY_FILE:-}"
      XAI_API_KEY_AWS_SECRET_ID: ${XAI_API_KEY_AWS_SECRET_ID:-}
      XAI_API_KEY_AWS_SECRET_KEY: ${XAI_API_KEY_AWS_SECRET_KEY:-}
      XAI_BASE_URL: "${XAI_BASE_URL:-https://api.x.ai/v1}"
      XAI_TEXT_MODEL: "${XAI_TEXT_MODEL:-grok-4.20-beta-latest-non-reasoning}"
      XAI_IMAGE_MODEL: "${XAI_IMAGE_MODEL:-grok-imagine-image}"
      XAI_VIDEO_MODEL: "${XAI_VIDEO_MODEL:-grok-imagine-video}"
      XAI_TTS_VOICE_ID: "${XAI_TTS_VOICE_ID:-eve}"
      VOICE_CLONE_MAX_BYTES: "${VOICE_CLONE_MAX_BYTES:-26214400}"
      SOCIAL_PUBLISH_MAX_ATTEMPTS: "${SOCIAL_PUBLISH_MAX_ATTEMPTS:-3}"
      SOCIAL_PUBLISH_RETRY_BACKOFF_SECONDS: "${SOCIAL_PUBLISH_RETRY_BACKOFF_SECONDS:-1.0}"
      XAI_STT_MODEL: "${XAI_STT_MODEL:-grok-voice-transcribe-2.0}"
      GROK_IMAGINE_TARGET_SEGMENT_SECONDS: "${GROK_IMAGINE_TARGET_SEGMENT_SECONDS:-15}"
      GROK_IMAGINE_INITIAL_CHUNK_SECONDS: "${GROK_IMAGINE_INITIAL_CHUNK_SECONDS:-15}"
      GROK_IMAGINE_EXTENSION_CHUNK_SECONDS: "${GROK_IMAGINE_EXTENSION_CHUNK_SECONDS:-10}"
      GROK_IMAGINE_ASPECT_RATIO: "${GROK_IMAGINE_ASPECT_RATIO:-16:9}"
      GROK_IMAGINE_RESOLUTION: "${GROK_IMAGINE_RESOLUTION:-720p}"
      GROK_IMAGINE_POLL_TIMEOUT_SECONDS: "${GROK_IMAGINE_POLL_TIMEOUT_SECONDS:-1800}"
      GROK_IMAGINE_POLL_INTERVAL_SECONDS: "${GROK_IMAGINE_POLL_INTERVAL_SECONDS:-5}"
      GROK_IMAGINE_MAX_CLIP_BYTES: "${GROK_IMAGINE_MAX_CLIP_BYTES:-2147483648}"
      FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS: "${FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS:-180}"
      FFMPEG_CONCAT_TIMEOUT_SECONDS: "${FFMPEG_CONCAT_TIMEOUT_SECONDS:-300}"
      VIDEO_IMPORT_MAX_BYTES: "${VIDEO_IMPORT_MAX_BYTES:-2147483648}"
      VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS: "${VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS:-10}"
      VIDEO_IMPORT_READ_TIMEOUT_SECONDS: "${VIDEO_IMPORT_READ_TIMEOUT_SECONDS:-60}"
      VIDEO_IMPORT_MAX_REDIRECTS: "${VIDEO_IMPORT_MAX_REDIRECTS:-5}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SECRET_KEY_FILE: "${STRIPE_SECRET_KEY_FILE:-}"
      STRIPE_SECRET_KEY_AWS_SECRET_ID: ${STRIPE_SECRET_KEY_AWS_SECRET_ID:-}
      STRIPE_SECRET_KEY_AWS_SECRET_KEY: ${STRIPE_SECRET_KEY_AWS_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID:-}
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY:-}
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://${DOMAIN_NAME}/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://${DOMAIN_NAME}/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC}"
      RHUBARB_PATH: "${RHUBARB_PATH}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_AUTH_REQUESTS: "${RATE_LIMIT_AUTH_REQUESTS:-15}"
      RATE_LIMIT_HEAVY_REQUESTS: "${RATE_LIMIT_HEAVY_REQUESTS:-30}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  worker:
    restart: unless-stopped
    volumes:
      - ./deploy:/app/deploy:ro
    environment:
      ENVIRONMENT: production
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-true}"
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRET_PREFIX: ${AWS_SECRET_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_URL_AWS_SECRET_ID: ${DATABASE_URL_AWS_SECRET_ID:-}
      DATABASE_URL_AWS_SECRET_KEY: ${DATABASE_URL_AWS_SECRET_KEY:-}
      STORAGE_BACKEND: s3
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY_FILE: ${S3_ACCESS_KEY_FILE:-}
      S3_SECRET_KEY_FILE: ${S3_SECRET_KEY_FILE:-}
      S3_ACCESS_KEY_AWS_SECRET_ID: ${S3_ACCESS_KEY_AWS_SECRET_ID:-}
      S3_ACCESS_KEY_AWS_SECRET_KEY: ${S3_ACCESS_KEY_AWS_SECRET_KEY:-}
      S3_SECRET_KEY_AWS_SECRET_ID: ${S3_SECRET_KEY_AWS_SECRET_ID:-}
      S3_SECRET_KEY_AWS_SECRET_KEY: ${S3_SECRET_KEY_AWS_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      FACTORY_MODE_ENABLED: "${FACTORY_MODE_ENABLED:-false}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_SECRET_AWS_SECRET_ID: ${JWT_SECRET_AWS_SECRET_ID:-}
      JWT_SECRET_AWS_SECRET_KEY: ${JWT_SECRET_AWS_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD_FILE: ${ADMIN_DASHBOARD_PASSWORD_FILE:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY:-}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      ADMIN_2FA_TOTP_SECRET: ${ADMIN_2FA_TOTP_SECRET:-}
      ADMIN_2FA_TOTP_SECRET_FILE: ${ADMIN_2FA_TOTP_SECRET_FILE:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      ADMIN_PASSWORD_AWS_SECRET_ID: ${ADMIN_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_PASSWORD_AWS_SECRET_KEY: ${ADMIN_PASSWORD_AWS_SECRET_KEY:-}
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_API_KEY_FILE: "${XAI_API_KEY_FILE:-}"
      XAI_API_KEY_AWS_SECRET_ID: ${XAI_API_KEY_AWS_SECRET_ID:-}
      XAI_API_KEY_AWS_SECRET_KEY: ${XAI_API_KEY_AWS_SECRET_KEY:-}
      XAI_BASE_URL: "${XAI_BASE_URL:-https://api.x.ai/v1}"
      XAI_TEXT_MODEL: "${XAI_TEXT_MODEL:-grok-4.20-beta-latest-non-reasoning}"
      XAI_IMAGE_MODEL: "${XAI_IMAGE_MODEL:-grok-imagine-image}"
      XAI_VIDEO_MODEL: "${XAI_VIDEO_MODEL:-grok-imagine-video}"
      XAI_TTS_VOICE_ID: "${XAI_TTS_VOICE_ID:-eve}"
      VOICE_CLONE_MAX_BYTES: "${VOICE_CLONE_MAX_BYTES:-26214400}"
      SOCIAL_PUBLISH_MAX_ATTEMPTS: "${SOCIAL_PUBLISH_MAX_ATTEMPTS:-3}"
      SOCIAL_PUBLISH_RETRY_BACKOFF_SECONDS: "${SOCIAL_PUBLISH_RETRY_BACKOFF_SECONDS:-1.0}"
      XAI_STT_MODEL: "${XAI_STT_MODEL:-grok-voice-transcribe-2.0}"
      GROK_IMAGINE_TARGET_SEGMENT_SECONDS: "${GROK_IMAGINE_TARGET_SEGMENT_SECONDS:-15}"
      GROK_IMAGINE_INITIAL_CHUNK_SECONDS: "${GROK_IMAGINE_INITIAL_CHUNK_SECONDS:-15}"
      GROK_IMAGINE_EXTENSION_CHUNK_SECONDS: "${GROK_IMAGINE_EXTENSION_CHUNK_SECONDS:-10}"
      GROK_IMAGINE_ASPECT_RATIO: "${GROK_IMAGINE_ASPECT_RATIO:-16:9}"
      GROK_IMAGINE_RESOLUTION: "${GROK_IMAGINE_RESOLUTION:-720p}"
      GROK_IMAGINE_POLL_TIMEOUT_SECONDS: "${GROK_IMAGINE_POLL_TIMEOUT_SECONDS:-1800}"
      GROK_IMAGINE_POLL_INTERVAL_SECONDS: "${GROK_IMAGINE_POLL_INTERVAL_SECONDS:-5}"
      GROK_IMAGINE_MAX_CLIP_BYTES: "${GROK_IMAGINE_MAX_CLIP_BYTES:-2147483648}"
      FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS: "${FFMPEG_SCENE_RENDER_TIMEOUT_SECONDS:-180}"
      FFMPEG_CONCAT_TIMEOUT_SECONDS: "${FFMPEG_CONCAT_TIMEOUT_SECONDS:-300}"
      VIDEO_IMPORT_MAX_BYTES: "${VIDEO_IMPORT_MAX_BYTES:-2147483648}"
      VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS: "${VIDEO_IMPORT_CONNECT_TIMEOUT_SECONDS:-10}"
      VIDEO_IMPORT_READ_TIMEOUT_SECONDS: "${VIDEO_IMPORT_READ_TIMEOUT_SECONDS:-60}"
      VIDEO_IMPORT_MAX_REDIRECTS: "${VIDEO_IMPORT_MAX_REDIRECTS:-5}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SECRET_KEY_FILE: "${STRIPE_SECRET_KEY_FILE:-}"
      STRIPE_SECRET_KEY_AWS_SECRET_ID: ${STRIPE_SECRET_KEY_AWS_SECRET_ID:-}
      STRIPE_SECRET_KEY_AWS_SECRET_KEY: ${STRIPE_SECRET_KEY_AWS_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID:-}
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY:-}
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://${DOMAIN_NAME}/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://${DOMAIN_NAME}/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC}"
      RHUBARB_PATH: "${RHUBARB_PATH}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]elery'"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app beat -l info
    volumes:
      - ./deploy:/app/deploy:ro
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_URL_AWS_SECRET_ID: ${DATABASE_URL_AWS_SECRET_ID:-}
      DATABASE_URL_AWS_SECRET_KEY: ${DATABASE_URL_AWS_SECRET_KEY:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRET_PREFIX: ${AWS_SECRET_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://${DOMAIN_NAME}/api
      NEXT_PUBLIC_PROJECTS_BASE: ${S3_PUBLIC_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
