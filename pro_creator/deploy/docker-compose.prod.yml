version: "3.9"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    volumes:
      # Allow *_FILE secrets like ./deploy/secrets/jwt_secret to resolve inside the container.
      - ./deploy:/app/deploy:ro
    environment:
      ENVIRONMENT: production
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-true}"
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRET_PREFIX: ${AWS_SECRET_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_URL_AWS_SECRET_ID: ${DATABASE_URL_AWS_SECRET_ID:-}
      DATABASE_URL_AWS_SECRET_KEY: ${DATABASE_URL_AWS_SECRET_KEY:-}
      STORAGE_BACKEND: s3
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY_FILE: ${S3_ACCESS_KEY_FILE:-}
      S3_SECRET_KEY_FILE: ${S3_SECRET_KEY_FILE:-}
      S3_ACCESS_KEY_AWS_SECRET_ID: ${S3_ACCESS_KEY_AWS_SECRET_ID:-}
      S3_ACCESS_KEY_AWS_SECRET_KEY: ${S3_ACCESS_KEY_AWS_SECRET_KEY:-}
      S3_SECRET_KEY_AWS_SECRET_ID: ${S3_SECRET_KEY_AWS_SECRET_ID:-}
      S3_SECRET_KEY_AWS_SECRET_KEY: ${S3_SECRET_KEY_AWS_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_SECRET_AWS_SECRET_ID: ${JWT_SECRET_AWS_SECRET_ID:-}
      JWT_SECRET_AWS_SECRET_KEY: ${JWT_SECRET_AWS_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD_FILE: ${ADMIN_DASHBOARD_PASSWORD_FILE:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY:-}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      ADMIN_2FA_TOTP_SECRET: ${ADMIN_2FA_TOTP_SECRET:-}
      ADMIN_2FA_TOTP_SECRET_FILE: ${ADMIN_2FA_TOTP_SECRET_FILE:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      ADMIN_PASSWORD_AWS_SECRET_ID: ${ADMIN_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_PASSWORD_AWS_SECRET_KEY: ${ADMIN_PASSWORD_AWS_SECRET_KEY:-}
      ALLOWED_ORIGINS: https://${DOMAIN_NAME}
      OWNER_EMAIL_ALLOWLIST: "${OWNER_EMAIL_ALLOWLIST:-}"
      TTS_PROVIDER: "${TTS_PROVIDER}"
      XTTS_ENDPOINT: "${XTTS_ENDPOINT}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      ELEVENLABS_API_KEY_FILE: "${ELEVENLABS_API_KEY_FILE:-}"
      ELEVENLABS_API_KEY_AWS_SECRET_ID: ${ELEVENLABS_API_KEY_AWS_SECRET_ID:-}
      ELEVENLABS_API_KEY_AWS_SECRET_KEY: ${ELEVENLABS_API_KEY_AWS_SECRET_KEY:-}
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID}"
      ELEVENLABS_MODEL: "${ELEVENLABS_MODEL:-eleven_multilingual_v2}"
      SCRIPT_PROVIDER: "${SCRIPT_PROVIDER:-auto}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_KEY_FILE: "${OPENAI_API_KEY_FILE:-}"
      OPENAI_API_KEY_AWS_SECRET_ID: ${OPENAI_API_KEY_AWS_SECRET_ID:-}
      OPENAI_API_KEY_AWS_SECRET_KEY: ${OPENAI_API_KEY_AWS_SECRET_KEY:-}
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL_DRAFT: "${OPENAI_MODEL_DRAFT:-gpt-4o-mini}"
      OPENAI_MODEL_STANDARD: "${OPENAI_MODEL_STANDARD:-gpt-4o-mini}"
      OPENAI_MODEL_PREMIUM: "${OPENAI_MODEL_PREMIUM:-gpt-4.1}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SECRET_KEY_FILE: "${STRIPE_SECRET_KEY_FILE:-}"
      STRIPE_SECRET_KEY_AWS_SECRET_ID: ${STRIPE_SECRET_KEY_AWS_SECRET_ID:-}
      STRIPE_SECRET_KEY_AWS_SECRET_KEY: ${STRIPE_SECRET_KEY_AWS_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID:-}
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY:-}
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://${DOMAIN_NAME}/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://${DOMAIN_NAME}/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC}"
      RHUBARB_PATH: "${RHUBARB_PATH}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_AUTH_REQUESTS: "${RATE_LIMIT_AUTH_REQUESTS:-15}"
      RATE_LIMIT_HEAVY_REQUESTS: "${RATE_LIMIT_HEAVY_REQUESTS:-30}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  xtts:
    image: ${XTTS_IMAGE:-ghcr.io/coqui-ai/xtts:latest}
    restart: unless-stopped
    ports:
      - "8020:8020"

  worker:
    restart: unless-stopped
    volumes:
      - ./deploy:/app/deploy:ro
    environment:
      ENVIRONMENT: production
      STRICT_PROVIDER_VALIDATION: "${STRICT_PROVIDER_VALIDATION:-true}"
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRET_PREFIX: ${AWS_SECRET_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_URL_AWS_SECRET_ID: ${DATABASE_URL_AWS_SECRET_ID:-}
      DATABASE_URL_AWS_SECRET_KEY: ${DATABASE_URL_AWS_SECRET_KEY:-}
      STORAGE_BACKEND: s3
      PROJECTS_URL_BASE: ${S3_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY_FILE: ${S3_ACCESS_KEY_FILE:-}
      S3_SECRET_KEY_FILE: ${S3_SECRET_KEY_FILE:-}
      S3_ACCESS_KEY_AWS_SECRET_ID: ${S3_ACCESS_KEY_AWS_SECRET_ID:-}
      S3_ACCESS_KEY_AWS_SECRET_KEY: ${S3_ACCESS_KEY_AWS_SECRET_KEY:-}
      S3_SECRET_KEY_AWS_SECRET_ID: ${S3_SECRET_KEY_AWS_SECRET_ID:-}
      S3_SECRET_KEY_AWS_SECRET_KEY: ${S3_SECRET_KEY_AWS_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_USE_SSL: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_CELERY: "true"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default}"
      TENANT_HEADER_NAME: "${TENANT_HEADER_NAME:-X-Tenant-ID}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_SECRET_AWS_SECRET_ID: ${JWT_SECRET_AWS_SECRET_ID:-}
      JWT_SECRET_AWS_SECRET_KEY: ${JWT_SECRET_AWS_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD}
      ADMIN_DASHBOARD_PASSWORD_FILE: ${ADMIN_DASHBOARD_PASSWORD_FILE:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY: ${ADMIN_DASHBOARD_PASSWORD_AWS_SECRET_KEY:-}
      ADMIN_2FA_ENABLED: "${ADMIN_2FA_ENABLED:-false}"
      ADMIN_2FA_TOTP_SECRET: ${ADMIN_2FA_TOTP_SECRET:-}
      ADMIN_2FA_TOTP_SECRET_FILE: ${ADMIN_2FA_TOTP_SECRET_FILE:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_ID:-}
      ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY: ${ADMIN_2FA_TOTP_SECRET_AWS_SECRET_KEY:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
      ADMIN_PASSWORD_AWS_SECRET_ID: ${ADMIN_PASSWORD_AWS_SECRET_ID:-}
      ADMIN_PASSWORD_AWS_SECRET_KEY: ${ADMIN_PASSWORD_AWS_SECRET_KEY:-}
      TTS_PROVIDER: "${TTS_PROVIDER}"
      XTTS_ENDPOINT: "${XTTS_ENDPOINT}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}"
      ELEVENLABS_API_KEY_FILE: "${ELEVENLABS_API_KEY_FILE:-}"
      ELEVENLABS_API_KEY_AWS_SECRET_ID: ${ELEVENLABS_API_KEY_AWS_SECRET_ID:-}
      ELEVENLABS_API_KEY_AWS_SECRET_KEY: ${ELEVENLABS_API_KEY_AWS_SECRET_KEY:-}
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID}"
      ELEVENLABS_MODEL: "${ELEVENLABS_MODEL:-eleven_multilingual_v2}"
      SCRIPT_PROVIDER: "${SCRIPT_PROVIDER:-auto}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_KEY_FILE: "${OPENAI_API_KEY_FILE:-}"
      OPENAI_API_KEY_AWS_SECRET_ID: ${OPENAI_API_KEY_AWS_SECRET_ID:-}
      OPENAI_API_KEY_AWS_SECRET_KEY: ${OPENAI_API_KEY_AWS_SECRET_KEY:-}
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL_DRAFT: "${OPENAI_MODEL_DRAFT:-gpt-4o-mini}"
      OPENAI_MODEL_STANDARD: "${OPENAI_MODEL_STANDARD:-gpt-4o-mini}"
      OPENAI_MODEL_PREMIUM: "${OPENAI_MODEL_PREMIUM:-gpt-4.1}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_SECRET_KEY_FILE: "${STRIPE_SECRET_KEY_FILE:-}"
      STRIPE_SECRET_KEY_AWS_SECRET_ID: ${STRIPE_SECRET_KEY_AWS_SECRET_ID:-}
      STRIPE_SECRET_KEY_AWS_SECRET_KEY: ${STRIPE_SECRET_KEY_AWS_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_WEBHOOK_SECRET_FILE: "${STRIPE_WEBHOOK_SECRET_FILE:-}"
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_ID:-}
      STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY: ${STRIPE_WEBHOOK_SECRET_AWS_SECRET_KEY:-}
      STRIPE_PRICE_ID_MODERATE: "${STRIPE_PRICE_ID_MODERATE:-}"
      STRIPE_PRICE_ID_PRO: "${STRIPE_PRICE_ID_PRO:-}"
      STRIPE_PRICE_ID_STUDIO: "${STRIPE_PRICE_ID_STUDIO:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://${DOMAIN_NAME}/?checkout=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://${DOMAIN_NAME}/?checkout=cancel}"
      AUTO_LIPSYNC: "${AUTO_LIPSYNC}"
      RHUBARB_PATH: "${RHUBARB_PATH}"
      RHUBARB_TIMEOUT: "${RHUBARB_TIMEOUT:-30}"
      PROVIDER_RETRY_ATTEMPTS: "${PROVIDER_RETRY_ATTEMPTS:-2}"
      PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]elery'"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://${DOMAIN_NAME}/api
      NEXT_PUBLIC_PROJECTS_BASE: ${S3_PUBLIC_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
