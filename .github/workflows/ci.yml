name: CI

on:
  push:
    branches: ["main", "master", "codex/push-current-work", "deploy/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro_creator/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee pip-upgrade.log
          pip install -r requirements.txt 2>&1 | tee pip-install.log
      - name: Tests
        env:
          ENVIRONMENT: development
          AUTH_REQUIRED: "false"
          DATABASE_URL: sqlite:////tmp/pro_creator_ci.db
          STORAGE_BACKEND: local
          PROJECTS_DIR: /tmp/pro_creator_projects
          JWT_SECRET: ci-secret
          ADMIN_EMAIL: admin@procreator.local
          ADMIN_PASSWORD: LocalAdminPass123!
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-diagnostics
          path: |
            pro_creator/backend/pip-upgrade.log
            pro_creator/backend/pip-install.log
            pro_creator/backend/pytest.log
            pro_creator/backend/pytest-results.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: pro_creator/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: pro_creator/frontend/package-lock.json
      - name: Install deps
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Production build
        env:
          PRO_CREATOR_BACKEND_ORIGIN: https://api.example.com
          NEXT_PUBLIC_API_BASE: https://api.example.com
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-diagnostics-node-${{ matrix.node-version }}
          path: |
            pro_creator/frontend/npm-ci.log
            pro_creator/frontend/lint.log
            pro_creator/frontend/test.log
            pro_creator/frontend/build.log
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro_creator
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config >/dev/null

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro_creator
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Compose)
        run: ./scripts/integration_smoke.sh

  integration_full:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: pro_creator
    steps:
      - uses: actions/checkout@v4
      - name: Smoke Test (Compose, Full Stack)
        env:
          PC_SMOKE_MODE: full
        run: ./scripts/integration_smoke.sh

  stress_harness:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: pro_creator
    steps:
      - uses: actions/checkout@v4
      - name: Stress Harness (Tenant + Queue + Billing)
        env:
          PC_STRESS_REQUESTS_PER_TENANT: "10"
          PC_STRESS_CONCURRENCY: "4"
          PC_EXPECT_RATE_LIMIT: "true"
        run: ./scripts/stress_harness.sh
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report
          path: pro_creator/artifacts/stress-report.json
          if-no-files-found: warn
