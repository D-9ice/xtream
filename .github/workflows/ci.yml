name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro_creator/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        env:
          ENVIRONMENT: development
          AUTH_REQUIRED: "false"
          DATABASE_URL: sqlite:////tmp/pro_creator_ci.db
          STORAGE_BACKEND: local
          PROJECTS_DIR: /tmp/pro_creator_projects
          JWT_SECRET: ci-secret
          ADMIN_EMAIL: admin@procreator.local
          ADMIN_PASSWORD: LocalAdminPass123!
        run: |
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro_creator/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pro_creator/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

